# Local Supabase CLI configuration — `supabase start` / `supabase db reset`.
# See https://supabase.com/docs/guides/local-development/cli/config

project_id = "bass-stats"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"

[storage]
enabled = false
